name: .NET build verification

on:
  push:
    branches: [ main, main_*, release_* ]
  pull_request:
    branches: [ main, main_*, release_* ]
env:
  DOTNET_VERSION: '10.0.105'

jobs:
  IdeaStatiCa_Public:
    name: "Build IdeaStatiCa.Public.slnx"
    runs-on: windows-latest

    env: # Define the global configuration variable
      TreatWarningsAsErrors: "false" # Set to "true" or "false" as needed

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v3
      with:
        path: main

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 'Build'
      run:  dotnet build ./src/IdeaStatiCa.Public.slnx /p:Configuration=Release /p:TreatWarningsAsErrors=${{ env.TreatWarningsAsErrors }}
      working-directory: main

  IdeaStatiCa-SDK-Examples:
    name: "Build IdeaStatiCa-SDK-Examples.slnx"
    runs-on: windows-latest

    env: # Define the global configuration variable
      TreatWarningsAsErrors: "false" # Set to "true" or "false" as needed

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v3
      with:
        path: main

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 'Build'
      run:  dotnet build ./examples/IdeaStatiCa-SDK-Examples.slnx /p:Configuration=Release /p:TreatWarningsAsErrors=${{ env.TreatWarningsAsErrors }}
      working-directory: main

  ConnectionApiExamples:
    name: "Build IdeaStatiCa.ConnectionApi.Examples.slnx"
    runs-on: windows-latest

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v3
      with:
        path: main

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 'Build'
      run:  dotnet build ./src/api-sdks/connection-api/clients/csharp/examples/IdeaStatiCa.ConnectionApi.Examples.slnx /p:Configuration=Release
      working-directory: main

  ConRestApiClient_Python:
    name: "Test the Connection API Python client"
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v3
      with:
        path: main

    - name: 'Setup Python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 'Install dependencies'
      run: python -m pip install --requirement requirements.txt --requirement test-requirements.txt
      working-directory: main/src/api-sdks/connection-api/clients/python

    - name: 'Test (offline unit tests; tests marked requires_service need a running service and are not run here)'
      run: python -m pytest -m "not requires_service"
      working-directory: main/src/api-sdks/connection-api/clients/python

  RcsApiExamples:
    name: "Build IdeaStatiCa.RcsApi.Examples.slnx"
    runs-on: windows-latest

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v3
      with:
        path: main

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 'Build'
      run:  dotnet build ./src/api-sdks/rcs-api/clients/csharp/examples/IdeaStatiCa.RcsApi.Examples.slnx /p:Configuration=Release
      working-directory: main
